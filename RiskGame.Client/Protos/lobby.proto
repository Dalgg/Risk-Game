syntax = "proto3";
option csharp_namespace = "RiskGame.Contracts.Lobby";
package riskgame.lobby;

import "google/protobuf/empty.proto";
import "common.proto";

service Lobby {
  rpc CreateLobby (CreateLobbyRequest) returns (LobbyDetails);
  rpc JoinLobby (JoinLobbyRequest) returns (LobbyDetails);
  rpc LeaveLobby (UserLobbyRequest) returns (google.protobuf.Empty);
  rpc StartMatch (UserLobbyRequest) returns (StartMatchResponse);
  rpc GetFriends (UserLobbyRequest) returns (FriendSummaryList);
  rpc InviteFriend (InviteFriendRequest) returns (google.protobuf.Empty);
  rpc SubscribeLobbyEvents (UserLobbyRequest) returns (stream LobbyEvent);
}

enum LobbyStatus {
  LOBBY_STATUS_WAITING = 0;
  LOBBY_STATUS_STARTING = 1;
  LOBBY_STATUS_IN_MATCH = 2;
  LOBBY_STATUS_CLOSED = 3;
}

message LobbyRules {
  riskgame.common.RulesVariant rules_variant = 1;
  int32 turn_duration_seconds = 2;
  int32 max_players = 3;
  bool is_private = 4;
}

message LobbyPlayer {
  riskgame.common.PlayerSummary player = 1;
  bool is_ready = 2;
  bool is_host = 3;
  riskgame.common.PlayerColor color = 4;
}

message LobbyDetails {
  int32 lobby_id = 1;
  string lobby_code = 2;
  int32 host_user_id = 3;
  LobbyRules rules = 4;
  LobbyStatus status = 5;
  repeated LobbyPlayer players = 6;
}

message CreateLobbyRequest {
  LobbyRules rules = 1;
  riskgame.common.PlayerSummary player = 2;
}

message JoinLobbyRequest {
  string lobby_code = 1;
  riskgame.common.PlayerSummary player = 2;
}

message UserLobbyRequest {
  int32 user_id = 1;
}

message InviteFriendRequest {
  int32 sender_user_id = 1;
  int32 recipient_user_id = 2;
}

message StartMatchResponse {
  int32 match_id = 1;
}

message FriendSummary {
  int32 user_id = 1;
  string nickname = 2;
  string avatar_reference = 3;
  bool is_online = 4;
}

message FriendSummaryList {
  repeated FriendSummary friends = 1;
}

message LobbyEvent {
  LobbyDetails lobby = 1;
  int32 started_match_id = 2;
}
