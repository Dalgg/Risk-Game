syntax = "proto3";
option csharp_namespace = "RiskGame.Contracts.Match";
package riskgame.match;

import "common.proto";

service Match {
  rpc SubscribeMatchEvents (MatchSubscription) returns (stream BoardState);
  rpc RollDice (RollDiceRequest) returns (BoardState);
  rpc ChooseDicePair (PairChoice) returns (BoardState);
  rpc StopTurn (StopTurnRequest) returns (BoardState);
  rpc LeaveMatch (MatchSubscription) returns (BoardState);
}

enum MatchEndReason {
  MATCH_END_REASON_UNSPECIFIED = 0;
  MATCH_END_REASON_VICTORY = 1;
  MATCH_END_REASON_ABANDONMENT = 2;
  MATCH_END_REASON_CANCELLED = 3;
}

message MatchSubscription {
  int32 match_id = 1;
  int32 user_id = 2;
  string session_token = 3;
}

message BoardState {
  int32 match_id = 1;
  int32 current_turn_user_id = 2;
  int64 revision = 3;
  repeated BoardPlayer players = 4;
  repeated BoardColumn columns = 5;
  riskgame.common.RulesVariant rules_variant = 6;
  int32 turn_duration_seconds = 7;
  repeated int32 dice = 8;
  repeated PairOption pair_options = 9;
  int64 roll_id = 10;
  bool awaiting_pair_choice = 11;
  int32 selected_pair_index = 12;
  map<int32, int32> temporary_steps_by_column = 13;
  int32 maximum_temporary_markers = 14;
  int64 turn_id = 15;
  int32 last_turn_user_id = 16;
  bool last_turn_busted = 17;
  bool can_stop = 18;
  bool is_finished = 19;
  int32 winner_user_id = 20;
  int32 columns_to_win = 21;
  int64 turn_remaining_milliseconds = 22;
  bool last_turn_timed_out = 23;
  MatchEndReason end_reason = 24;
  int32 reconnection_grace_seconds = 25;
}

message StopTurnRequest {
  int32 match_id = 1;
  int32 user_id = 2;
  string session_token = 3;
  int64 turn_id = 4;
}

message RollDiceRequest {
  int32 match_id = 1;
  int32 user_id = 2;
  string session_token = 3;
  int64 expected_roll_id = 4;
  int64 turn_id = 5;
}

message PairChoice {
  int32 match_id = 1;
  int32 user_id = 2;
  string session_token = 3;
  int64 roll_id = 4;
  int32 pair_index = 5;
  int32 preferred_column = 6;
  int64 turn_id = 7;
}

message PairOption {
  int32 pair_index = 1;
  repeated int32 first_pair_dice = 2;
  repeated int32 second_pair_dice = 3;
  int32 first_sum = 4;
  int32 second_sum = 5;
  bool is_playable = 6;
  bool requires_column_choice = 7;
}

message BoardPlayer {
  int32 user_id = 1;
  string nickname = 2;
  riskgame.common.PlayerColor color = 3;
  bool is_connected = 4;
  int32 claimed_columns = 5;
  bool has_abandoned = 6;
  int32 reconnection_seconds_remaining = 7;
}

message BoardColumn {
  int32 column_number = 1;
  int32 maximum_steps = 2;
  map<int32, int32> steps_by_user_id = 3;
  bool is_claimed = 4;
  int32 owner_user_id = 5;
}
