syntax = "proto3";
option csharp_namespace = "RiskGame.Contracts.Chat";
package riskgame.chat;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "common.proto";

service Chat {
  rpc SendMessage (ChatMessage) returns (google.protobuf.Empty);
  rpc SubscribeChat (ChatChannel) returns (stream ChatMessage);
}

message ChatChannel {
  int32 user_id = 1;
}

message ChatMessage {
  string text = 1;
  riskgame.common.PlayerSummary sender = 2;
  google.protobuf.Timestamp sent_at = 3;
}
