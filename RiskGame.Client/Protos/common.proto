syntax = "proto3";
option csharp_namespace = "RiskGame.Contracts.Common";
package riskgame.common;

enum FaultCode {
  FAULT_CODE_UNSPECIFIED = 0;

  FAULT_CODE_INVALID_CREDENTIALS = 1;
  FAULT_CODE_INVALID_EMAIL = 2;
  FAULT_CODE_INVALID_USERNAME = 3;
  FAULT_CODE_INVALID_NICKNAME = 4;
  FAULT_CODE_WEAK_PASSWORD = 5;
  FAULT_CODE_USERNAME_EXISTS = 6;
  FAULT_CODE_EMAIL_EXISTS = 7;

  FAULT_CODE_INVALID_RECOVERY_CODE = 10;
  FAULT_CODE_RECOVERY_CODE_EXPIRED = 11;

  FAULT_CODE_SESSION_EXPIRED = 20;
  FAULT_CODE_NOT_AUTHORIZED = 21;
  FAULT_CODE_GUEST_NOT_ALLOWED = 22;

  FAULT_CODE_USER_NOT_FOUND = 30;
  FAULT_CODE_FRIENDSHIP_NOT_FOUND = 31;
  FAULT_CODE_ALREADY_FRIENDS = 32;

  FAULT_CODE_LOBBY_NOT_FOUND = 40;
  FAULT_CODE_LOBBY_FULL = 41;
  FAULT_CODE_ALREADY_IN_LOBBY = 42;
  FAULT_CODE_NOT_IN_LOBBY = 43;
  FAULT_CODE_NOT_ENOUGH_PLAYERS = 44;
  FAULT_CODE_NOT_LOBBY_HOST = 45;
  FAULT_CODE_INVALID_RULES = 46;
  FAULT_CODE_INVALID_INVITATION = 47;

  FAULT_CODE_MESSAGE_TOO_LONG = 50;

  FAULT_CODE_NOT_IN_MATCH = 60;
  FAULT_CODE_NOT_YOUR_TURN = 61;
  FAULT_CODE_INVALID_PAIR_SELECTION = 62;
  FAULT_CODE_NO_NEUTRAL_MARKERS_LEFT = 63;
  FAULT_CODE_TURN_DEADLINE_EXPIRED = 64;

  FAULT_CODE_DATABASE_UNAVAILABLE = 90;
  FAULT_CODE_SMTP_UNAVAILABLE = 91;
}

message PlayerSummary {
  int32 user_id = 1;
  string nickname = 2;
  string avatar_reference = 3;
  bool is_guest = 4;
}

enum PlayerActivity {
  PLAYER_ACTIVITY_MENU = 0;
  PLAYER_ACTIVITY_IN_LOBBY = 1;
  PLAYER_ACTIVITY_IN_MATCH = 2;
}

enum PlayerColor {
  PLAYER_COLOR_RED = 0;
  PLAYER_COLOR_BLUE = 1;
  PLAYER_COLOR_GREEN = 2;
  PLAYER_COLOR_YELLOW = 3;
}

enum RulesVariant {
  RULES_VARIANT_STANDARD = 0;
  RULES_VARIANT_FAST = 1;
}

enum MatchEndReason {
  MATCH_END_REASON_COMPLETED = 0;
  MATCH_END_REASON_OPPONENTS_LEFT = 1;
  MATCH_END_REASON_ABANDONED = 2;
}
