syntax = "proto3";
option csharp_namespace = "RiskGame.Contracts.Chat";
package riskgame.chat;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "common.proto";

service Chat {
  rpc SendMessage (ChatMessage) returns (google.protobuf.Empty);
  rpc SubscribeChat (ChatChannel) returns (stream ChatMessage);
}

enum ChatScope {
  CHAT_SCOPE_LOBBY = 0;
  CHAT_SCOPE_MATCH = 1;
  CHAT_SCOPE_PRIVATE = 2;
}

message ChatChannel {
  ChatScope scope = 1;
}

message ChatMessage {
  ChatScope scope = 1;
  optional int32 recipient_user_id = 2;
  string text = 3;
  riskgame.common.PlayerSummary sender = 4;
  google.protobuf.Timestamp sent_at = 5;
}
