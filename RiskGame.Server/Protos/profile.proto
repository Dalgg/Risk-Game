syntax = "proto3";
option csharp_namespace = "RiskGame.Contracts.Profile";
package riskgame.profile;

service Profile {
  rpc GetProfile (ProfileQuery) returns (UserProfile);
  rpc UpdateNickname (UpdateNicknameRequest) returns (UserProfile);
  rpc UpdateAvatar (UpdateAvatarRequest) returns (UserProfile);
}

message ProfileQuery {
  int32 user_id = 1;
  string session_token = 2;
}

message UserProfile {
  int32 user_id = 1;
  string username = 2;
  string avatar_reference = 3;
  int32 matches_played = 4;
  int32 matches_won = 5;
  string nickname = 6;
  repeated RecentMatchResult recent_matches = 7;
}

message RecentMatchResult {
  int32 match_id = 1;
  int64 end_time_unix_seconds = 2;
  bool is_winner = 3;
  int32 claimed_columns = 4;
  bool has_claimed_columns = 5;
  string end_reason = 6;
  bool has_result = 7;
}

message UpdateNicknameRequest {
  int32 user_id = 1;
  string session_token = 2;
  string nickname = 3;
}

message UpdateAvatarRequest {
  int32 user_id = 1;
  string session_token = 2;
  string avatar_reference = 3;
}
