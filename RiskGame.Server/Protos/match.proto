syntax = "proto3";
option csharp_namespace = "RiskGame.Contracts.Match";
package riskgame.match;

import "common.proto";

service Match {
  rpc SubscribeMatchEvents (MatchSubscription) returns (stream BoardState);
  rpc RollDice (RollDiceRequest) returns (BoardState);
  rpc ChooseDicePair (PairChoice) returns (BoardState);
}

message MatchSubscription {
  int32 match_id = 1;
  int32 user_id = 2;
  string session_token = 3;
}

message BoardState {
  int32 match_id = 1;
  int32 current_turn_user_id = 2;
  int64 revision = 3;
  repeated BoardPlayer players = 4;
  repeated BoardColumn columns = 5;
  riskgame.common.RulesVariant rules_variant = 6;
  int32 turn_duration_seconds = 7;
  repeated int32 dice = 8;
  repeated PairOption pair_options = 9;
  int64 roll_id = 10;
  bool awaiting_pair_choice = 11;
  int32 selected_pair_index = 12;
}

message RollDiceRequest {
  int32 match_id = 1;
  int32 user_id = 2;
  string session_token = 3;
  int64 expected_roll_id = 4;
}

message PairChoice {
  int32 match_id = 1;
  int32 user_id = 2;
  string session_token = 3;
  int64 roll_id = 4;
  int32 pair_index = 5;
}

message PairOption {
  int32 pair_index = 1;
  repeated int32 first_pair_dice = 2;
  repeated int32 second_pair_dice = 3;
  int32 first_sum = 4;
  int32 second_sum = 5;
}

message BoardPlayer {
  int32 user_id = 1;
  string nickname = 2;
  riskgame.common.PlayerColor color = 3;
  bool is_connected = 4;
}

message BoardColumn {
  int32 column_number = 1;
  int32 maximum_steps = 2;
  map<int32, int32> steps_by_user_id = 3;
}
