syntax = "proto3";
option csharp_namespace = "RiskGame.Contracts.Auth";
package riskgame.auth;

import "google/protobuf/empty.proto";

service AuthGrpc {
  rpc Register (RegisterRequest) returns (RegisterResponse);
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc Logout (LogoutRequest) returns (google.protobuf.Empty);
  rpc ConfirmRegistration (RegistrationConfirmation) returns (RegisterResponse);
  rpc ResendVerification (RegistrationReference) returns (google.protobuf.Empty);
  rpc SubscribeSession (SessionRequest) returns (stream SessionState);
  rpc RequestPasswordReset (PasswordResetRequest) returns (PasswordResetResponse);
  rpc ConfirmPasswordReset (PasswordResetConfirmation) returns (google.protobuf.Empty);
  rpc ResendPasswordReset (PasswordResetReference) returns (google.protobuf.Empty);
}

message RegisterRequest {
  string email = 1;
  string username = 2;
  string password = 3;
}

message RegisterResponse {
  int32 result_code = 1;
  string message = 2;
  string registration_id = 3;
}

message RegistrationConfirmation {
  string registration_id = 1;
  string code = 2;
}

message RegistrationReference {
  string registration_id = 1;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message PlayerDto {
  int32 user_id = 1;
  string username = 2;
  string nickname = 3;
  string avatar_reference = 4;
}

message LoginResponse {
  bool is_authenticated = 1;
  string session_token = 2;
  PlayerDto player = 3;
  bool is_suspended = 4;
  int64 banned_until_unix_milliseconds = 5;
}

message LogoutRequest {
  string session_token = 1;
}

message SessionRequest {
  int32 user_id = 1;
  string session_token = 2;
}

message SessionState {
  bool is_authenticated = 1;
  bool is_suspended = 2;
  int64 banned_until_unix_milliseconds = 3;
}

message PasswordResetRequest {
  string email = 1;
}

message PasswordResetResponse {
  string reset_id = 1;
}

message PasswordResetConfirmation {
  string reset_id = 1;
  string code = 2;
  string new_password = 3;
}

message PasswordResetReference {
  string reset_id = 1;
}
